steps:
  # 1. Build Container Image via Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mindsync-ai:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mindsync-ai:latest'
      - '.'

  # 2. Push Image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/mindsync-ai:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/mindsync-ai:latest']

  # 3. Deploy to Google Cloud Run with Secret Manager Bindings
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mindsync-ai-journal'
      - '--image=gcr.io/$PROJECT_ID/mindsync-ai:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GEMINI_SECRET_NAME=gemini-api-key'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=10'

images:
  - 'gcr.io/$PROJECT_ID/mindsync-ai:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/mindsync-ai:latest'

options:
  logging: CLOUD_LOGGING_ONLY
