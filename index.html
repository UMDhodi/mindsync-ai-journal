<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('mindsync_theme_mode') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <title>MindSync AI - Personal Gemini Journal</title>
    <meta name="description" content="Secure, multi-tenant Personal Gemini Journal & Brainstorming Web Application backed by Firebase Auth, Cloud Firestore with strict user isolation, Google Cloud Secret Manager, and MindSync Cognitive Engine." />
    <meta property="og:title" content="MindSync AI - Personal Gemini Journal" />
    <meta property="og:description" content="Secure, multi-tenant Personal Gemini Journal & Brainstorming Web Application backed by Firebase Auth, Cloud Firestore with strict user isolation, Google Cloud Secret Manager, and MindSync Cognitive Engine." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
